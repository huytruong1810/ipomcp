# Level-3 i versus level-2 j in the published two-agent Tiger.
# i's prior over j's level: L1 .8, L2 .1, L0 .1. Its modeled j/L2 holds the real
# j's prior over i (L1 .5, L0 .5): an assumption that i knows j's level prior.
# j's prior over i: L1 .5, L0 .5; the real i (L3) lies outside that support.
#
# Both agents plan a fixed 3-step receding lookahead with 1,000 root simulations
# and compressed beliefs (exact updates, supports bounded to 64 atoms; THEORY.md).
# Modeled levels use the stacks certified at horizon 3 (RESULTS.md 12.5, 12.9,
# 12.11, 12.14): i models j/L2 with stopping capped at 6,400 over i/L1 flat 100;
# j models i/L1 with a flat 400. Gated under these mixed priors against the exact
# I-POMDP in results/w4_mixed_prior_gate_20261006 (120/120 optimal).
name = "tiger-l3-vs-l2"
domain = "tiger"
trials = 100
steps = 20
record_hierarchies = true
workers = 12
trial_timeout_seconds = 14400.0
max_trial_rss_mb = 3072.0

[agents.i]
level = 3
particles = 64
planner = { kind = "ipomcp", simulations = 1000, depth = 3, modeled_simulations = 1000 }
modeled = "6400s/100"
level_weights = { 1 = 0.8, 2 = 0.1, 0 = 0.1 }
nested_level_weights = { 2 = { 1 = 0.5, 0 = 0.5 }, 1 = { 0 = 1.0 } }

[agents.j]
level = 2
particles = 64
planner = { kind = "ipomcp", simulations = 1000, depth = 3, modeled_simulations = 1000 }
modeled = "400"
level_weights = { 1 = 0.5, 0 = 0.5 }
nested_level_weights = { 1 = { 0 = 1.0 } }
